<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPilot AI</title>
  <style>
    /* ── Popup Styles ────────────────────────────────── */
    :root {
      --color-bg:       #F8F7F4;
      --color-surface:  #FFFFFF;
      --color-border:   #E5E2DC;
      --color-text:     #1C1917;
      --color-muted:    #6B7280;
      --color-primary:  #2563EB;
      --color-success:  #16A34A;
      --color-warning:  #D97706;
      --radius:         8px;
    }

    .hidden { display: none !important; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--color-text);
      background: var(--color-bg);
      width: 320px;
      min-height: 200px;
    }

    /* ── Header ─────────────────────────────────────── */
    .popup-header {
      background: var(--color-surface);
      border-bottom: 1px solid var(--color-border);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .popup-header svg { flex-shrink: 0; }
    .popup-header-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--color-text);
    }
    .popup-header-subtitle {
      font-size: 11px;
      color: var(--color-muted);
    }

    /* ── Body ────────────────────────────────────────── */
    .popup-body { padding: 14px; }

    /* ── Video Info ──────────────────────────────────── */
    .video-info {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }
    .video-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-channel {
      font-size: 11px;
      color: var(--color-muted);
      margin-bottom: 8px;
    }
    .progress-bar {
      width: 100%;
      height: 5px;
      background: var(--color-border);
      border-radius: 100px;
      overflow: hidden;
      margin-bottom: 4px;
    }
    .progress-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: 100px;
      transition: width 0.3s;
    }
    .progress-text {
      font-size: 11px;
      color: var(--color-muted);
      display: flex;
      justify-content: space-between;
    }

    /* ── Stats Row ───────────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 10px;
      text-align: center;
    }
    .stat-box-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text);
      line-height: 1.1;
    }
    .stat-box-label {
      font-size: 10px;
      color: var(--color-muted);
      margin-top: 2px;
    }

    /* ── Action Buttons ──────────────────────────────── */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid transparent;
      font-family: inherit;
      transition: background 0.15s;
    }
    .btn-primary  { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .btn-primary:hover { background: #1D4ED8; }
    .btn-ghost    { background: var(--color-surface); color: var(--color-text); border-color: var(--color-border); }
    .btn-ghost:hover { background: #F0EDE8; }
    .btn-success  { background: var(--color-success); color: #fff; border-color: var(--color-success); }
    .btn-row { display: flex; gap: 6px; }
    .btn-row .btn { flex: 1; }

    /* ── Subject Select ──────────────────────────────── */
    .subject-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .subject-row label { font-size: 11px; color: var(--color-muted); white-space: nowrap; }
    .subject-select {
      flex: 1;
      padding: 6px 8px;
      border: 1.5px solid var(--color-border);
      border-radius: 6px;
      font-size: 11px;
      background: var(--color-surface);
      outline: none;
      font-family: inherit;
    }

    /* ── Sync Status ─────────────────────────────────── */
    .sync-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--color-muted);
      border-top: 1px solid var(--color-border);
      padding-top: 10px;
    }
    .sync-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-success);
      display: inline-block;
      margin-right: 5px;
    }
    .sync-dot.syncing { background: var(--color-warning); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── No Video State ──────────────────────────────── */
    .no-video {
      text-align: center;
      padding: 24px 16px;
      color: var(--color-muted);
    }
    .no-video-icon { font-size: 28px; margin-bottom: 8px; }

    /* ── Badge ───────────────────────────────────────── */
    .badge {
      padding: 1px 6px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 600;
    }
    .badge-green  { background: #DCFCE7; color: #15803D; }
    .badge-yellow { background: #FEF9C3; color: #A16207; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="popup-header">
    <svg width="22" height="22" viewBox="0 0 28 28" fill="none">
      <rect width="28" height="28" rx="7" fill="#2563EB"/>
      <path d="M8 14l4 4 8-8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="popup-header-title">StudyPilot AI</div>
      <div class="popup-header-subtitle">YouTube Study Tracker</div>
    </div>
  </div>

  <!-- Body -->
  <div class="popup-body">

    <!-- STATE: No video currently playing -->
    <div id="no-video-state" class="no-video hidden">
      <div class="no-video-icon">🎥</div>
      <div style="font-weight:600; margin-bottom:4px;">No YouTube video detected</div>
      <div style="font-size:11px; margin-bottom:14px;">Open a YouTube lecture video to start tracking, or add a sample lecture to test sync immediately.</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button id="btn-add-test-video" class="btn btn-ghost" style="font-size:11px; border:1.5px dashed var(--color-primary); color:var(--color-primary);">
          ⚡ Add Sample Lecture (Test Sync)
        </button>
        <button id="btn-open-dashboard" class="btn btn-primary" style="font-size:12px;">
          Open Dashboard ↗
        </button>
      </div>
    </div>

    <!-- STATE: Video is playing -->
    <div id="video-state" class="hidden">

      <!-- Video info card -->
      <div class="video-info">
        <div class="video-title" id="popup-video-title">Loading…</div>
        <div class="video-channel" id="popup-channel"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="popup-progress-bar" style="width:0%"></div>
        </div>
        <div class="progress-text">
          <span id="popup-watched-time">0s</span>
          <span id="popup-pct">0% watched</span>
        </div>
      </div>

      <!-- Today's study time -->
      <div class="stats-row">
        <div class="stat-box">
          <div class="stat-box-value" id="popup-today-time">0m</div>
          <div class="stat-box-label">Today's Study</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-value" id="popup-video-complete">
            <span class="badge badge-yellow" id="popup-status-badge">In Progress</span>
          </div>
          <div class="stat-box-label">Video Status</div>
        </div>
      </div>

      <!-- Domain selector -->
      <div class="subject-row">
        <label for="popup-domain-select">Domain:</label>
        <select id="popup-domain-select" class="subject-select">
          <option value="aktu">AKTU Academic</option>
          <option value="dsa">DSA</option>
          <option value="webdev">Web Development</option>
        </select>
      </div>

      <!-- Subject assignment -->
      <div class="subject-row">
        <label for="popup-subject-select">Subject:</label>
        <select id="popup-subject-select" class="subject-select">
          <option value="">-- Assign subject --</option>
          <option value="DS">Data Structures</option>
          <option value="OOP">OOP / C++</option>
          <option value="DELD">Digital Electronics</option>
          <option value="MATH3">Mathematics III</option>
          <option value="OS">Operating Systems</option>
          <option value="DBMS">DBMS</option>
          <option value="CN">Computer Networks</option>
          <option value="SE">Software Engineering</option>
          <option value="Frontend">Frontend / HTML / CSS</option>
          <option value="JavaScript">JavaScript & APIs</option>
          <option value="Backend">Backend & Databases</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Action buttons -->
      <div class="actions">
        <div class="btn-row">
          <button class="btn btn-primary" id="btn-bookmark">
            🔖 Bookmark
          </button>
          <button class="btn btn-ghost" id="btn-study-toggle">
            ✓ Studying
          </button>
        </div>
        <a href="http://localhost:8000/pages/dashboard.html"
           target="_blank" class="btn btn-ghost" style="text-decoration:none;">
          Open Dashboard ↗
        </a>
      </div>

      <!-- Bookmark category (hidden by default) -->
      <div id="bookmark-cat-row" style="display:none; margin-bottom:12px; background:var(--color-bg); padding:8px; border-radius:6px; border:1px solid var(--color-border);">
        <div id="bm-timestamp-preview" style="font-size:11px; font-weight:600; color:var(--color-primary); margin-bottom:6px;">⏱ At 00:00</div>
        <div style="font-size:10px; color:var(--color-muted); margin-bottom:6px;">Choose bookmark label:</div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px;">
          <button class="btn btn-ghost btn-bm-cat" data-category="important" style="font-size:10px; padding:4px 6px;">Important</button>
          <button class="btn btn-ghost btn-bm-cat" data-category="revision" style="font-size:10px; padding:4px 6px;">Revision</button>
          <button class="btn btn-ghost btn-bm-cat" data-category="difficult" style="font-size:10px; padding:4px 6px;">Difficult</button>
          <button class="btn btn-ghost btn-bm-cat" data-category="doubt" style="font-size:10px; padding:4px 6px;">Doubt</button>
        </div>
      </div>

      <!-- Sync status -->
      <div class="sync-row">
        <span>
          <span class="sync-dot" id="sync-dot"></span>
          <span id="sync-status">Tracking locally</span>
        </span>
        <button id="btn-sync-now" class="btn btn-ghost" style="padding:3px 8px; font-size:10px;">Sync now</button>
      </div>
    </div>

  </div><!-- end popup-body -->

  <script src="popup.js"></script>
</body>
</html>
